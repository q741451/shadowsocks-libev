name: Static Build & Release

on:
  push:
    branches: [ slim-static ]
    tags:
      - 'v*-static*'
  pull_request:
    branches: [ slim-static ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every architecture uses the abcfy2/muslcc-toolchain-ubuntu image,
          # which repackages the musl.cc toolchains one tag per triplet. It
          # avoids downloading from musl.cc directly and covers targets the
          # dockcross images do not, such as x86_64-musl and soft-float mips.
          # tests: one test-static.py run per line; each --path names the
          # AES code the CPU must get, then the environment forcing it (here
          # also the SHA-1 paths: on x86_64 without SHA-NI, on aarch64 without
          # the SHA1 instructions)
          - name: x86_64
            tag: x86_64-linux-musl
            tests: |
              --path hw --path hw 'OPENSSL_ia32cap=:~0x20000000' --path vpaes 'OPENSSL_ia32cap=~0x1200000200000000:~0x20' --path c 'OPENSSL_ia32cap=~0x1208020200000000:~0x20'

          - name: aarch64
            tag: aarch64-linux-musl
            tests: |
              --runner 'qemu-aarch64-static -cpu max' --path hw --path vpaes 'OPENSSL_armcap=~0x2c'

          # armv7 hard-float, current ARM routers and devices
          - name: armv7-hf
            tag: arm-linux-musleabihf
            tests: |
              --runner 'qemu-arm-static -cpu max' --path hw
              --runner 'qemu-arm-static -cpu cortex-a7' --path bsaes
              --runner 'qemu-arm-static -cpu arm1176' --path c

          # armv5 soft-float, older or low-end ARM routers
          - name: armv5-sf
            tag: arm-linux-musleabi
            tests: |
              --runner 'qemu-arm-static -cpu arm926' --path c

          # mips big-endian soft-float, FPU-less router SoCs
          - name: mips-sf
            tag: mips-linux-muslsf
            tests: |
              --runner qemu-mips-static --path c

          # mipsel little-endian soft-float, MTK and Ralink SoCs
          - name: mipsel-sf
            tag: mipsel-linux-muslsf
            tests: |
              --runner qemu-mipsel-static --path c

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pull cross toolchain image
        run: docker pull abcfy2/muslcc-toolchain-ubuntu:${{ matrix.tag }}

      - name: Build
        run: |
          set -e
          # The image ships the cross compiler only
          docker run --rm \
            -v "${{ github.workspace }}":/work \
            -w /work \
            abcfy2/muslcc-toolchain-ubuntu:${{ matrix.tag }} \
            bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                make autoconf automake libtool pkg-config \
                curl ca-certificates xz-utils file patch >/dev/null
              ./scripts/build-static.sh ${{ matrix.tag }}
            '

      - name: Test
        env:
          TESTS: ${{ matrix.tests }}
          RUST_VER: 1.25.0
          RUST_SHA: 8439bf43c324b0fc273e663d0b1f8926fd8f666cbd1e0fd59b35096f0e778e92
          AWSLC_VER: 5.11.0
          AWSLC_SHA: 8cb24c6e6be1fa7ff05075c4560ca8b537a7ef48f9e6f465af4ea455794d74f4
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static >/dev/null
          # shadowsocks-rust, the reference the AEAD ciphers are checked against
          RUST_TAR=shadowsocks-v$RUST_VER.x86_64-unknown-linux-musl.tar.xz
          curl -fsSL --retry 3 -o "$RUST_TAR" \
            "https://github.com/shadowsocks/shadowsocks-rust/releases/download/v$RUST_VER/$RUST_TAR"
          echo "$RUST_SHA  $RUST_TAR" | sha256sum -c -
          mkdir -p ssrust && tar xJf "$RUST_TAR" -C ssrust
          # AWS-LC's test vectors, for the known-answer test of src/vendor
          AWSLC_TAR=aws-lc-$AWSLC_VER.tar.gz
          curl -fsSL --retry 3 -o "$AWSLC_TAR" \
            "https://github.com/aws/aws-lc/archive/refs/tags/v$AWSLC_VER.tar.gz"
          echo "$AWSLC_SHA  $AWSLC_TAR" | sha256sum -c -
          tar xzf "$AWSLC_TAR" "aws-lc-$AWSLC_VER/crypto/cipher_extra/test"
          printf '%s\n' "$TESTS" | while read -r args; do
            [ -n "$args" ] || continue
            eval "python3 scripts/test-static.py dist/${{ matrix.tag }} --rust ssrust \
              --kat build/${{ matrix.tag }}/kat \
              --vectors aws-lc-$AWSLC_VER/crypto/cipher_extra/test $args" || exit 1
          done

      - name: Package
        run: |
          set -e
          # One archive per platform, holding all its executables
          OUT=shadowsocks-libev-${{ matrix.name }}
          mkdir -p "release/$OUT"
          cp dist/${{ matrix.tag }}/* "release/$OUT/"
          cp LICENSE "release/$OUT/" 2>/dev/null || true
          tar -C release -czf "release/$OUT.tar.gz" "$OUT"
          rm -rf "release/$OUT"
          ls -l release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadowsocks-libev-${{ matrix.name }}
          path: release/shadowsocks-libev-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
